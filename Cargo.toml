[package]
name = "lean4game"
version = "0.1.0"
edition = "2024"
authors = ["LEAN4 Game Team"]
license = "GPL-3.0-only"
description = "Desktop port of the LEAN4 Game with local filesystem persistence and interactive theorem proving"

[lib]
name = "lean4game"
path = "src/lib.rs"

[[bin]]
name = "lean4game"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
eframe = { version = "0.29", features = ["default"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.30"
url = "2.5"
wry = "0.47"

[dev-dependencies]
tempfile = "3.27.0"
